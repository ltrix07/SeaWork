# Языки, встречающиеся в требованиях вакансий.
#
# Ключ — код ISO 639-1, чтобы поле профиля пользователя и поле вакансии говорили
# на одном словаре без таблицы перевода.
#
# Английский заведён наравне с остальными, хотя упоминается почти везде (457 раз
# против 102 у всех прочих вместе). Решено 20.07.2026: для новичка это реальный
# барьер, а вакансия, где английский НЕ требуется, — ценная находка, и увидеть её
# можно только если требование извлекается везде.
#
# Сопоставление регистронезависимое и по границам слов: "Japanese" не должен
# срабатывать внутри других слов.

languages:
  - key: en
    aliases: [English]
  - key: ja
    aliases: [Japanese]
  - key: nl
    aliases: [Dutch]
  - key: de
    aliases: [German]
  - key: es
    aliases: [Spanish]
  - key: it
    aliases: [Italian]
  - key: fr
    aliases: [French]
  - key: pt
    aliases: [Portuguese]
  - key: zh
    aliases: [Mandarin, Chinese]
  - key: ru
    aliases: [Russian]
  - key: ko
    aliases: [Korean]
