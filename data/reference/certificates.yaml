certificates:
  # "Basic Safety" is STCW Basic Safety Training; it does not get its own key.
  - key: stcw
    patterns: [STCW, Basic Safety, BST]
  - key: seaman_book
    patterns: [seaman book, seaman's book, seafarer book]
  - key: passport
    patterns: [passport]
  - key: c1d_visa
    patterns: [C1/D, C-1/D, C1D visa]
  # "medical fitness" added 22.09.2026: Crewplanet writes "medical fitness check",
  # which none of the older wordings matched. Found by running the hand-labelled
  # quotes of the eval gold set against this file (docs/roadmap.md, C4).
  - key: marine_medical
    patterns: [marine fitness medical, seafarer medical, medical certificate, medical fitness]
  # Patterns must match the wording used by the source, not the canonical
  # certificate name. Verified against Pinpoint data: "Marlins Score 90 or above".
  - key: marlins
    patterns: [Marlins, Marlin test]
  - key: usph
    patterns: [USPH, U.S. Public Health]
  # "Food and Hygiene" is the same certificate with a conjunction in the name;
  # word-boundary matching treats it as a different string (C4, 22.09.2026).
  - key: food_hygiene
    patterns: [Food Hygiene, Food and Hygiene]
  # --- Merchant fleet, observed in Crewplanet requirements ---
  # "Tanker" is deliberately absent: in this corpus it denotes vessel type
  # ("Vessel Type: Oil Tanker"), not an endorsement, and would false-positive heavily.
  - key: coc
    patterns: [COC, Certificate of Competency]
  - key: dynamic_positioning
    patterns: [Dynamic Positioning, DP]
  - key: gmdss
    patterns: [GMDSS]
  - key: ces_test
    patterns: [CES test, CES tests, CES]
  - key: bosiet
    patterns: [BOSIET]
  - key: huet
    patterns: [HUET]
  - key: fast_rescue_boat
    patterns: [Fast Rescue Boat, FRB]
  - key: servsafe
    patterns: [ServSafe]
  - key: haccp
    patterns: [HACCP]
  - key: crowd_management
    patterns: [crowd management]
  # Паттерн «PADI» снят 22.09.2026. На доске дайв-вакансий бренд стоит почти в
  # каждом объявлении, и совпадало 206 записей из 282 — почти целиком реклама
  # центра («PADI 5 Star IDC dive center»), стоимость курса («PADI fee Not
  # Included») и то, чему там учат.
  #
  # Сузить до рангов не помогает: «Requirements: PADI Instructor certification» —
  # требование, «Position: PADI Instructor» — название должности, а «We offer:
  # FOC IDC/OWSI training» — обучение, которое дают, то есть кандидату оно как раз
  # не нужно. Это различие смысловое, а не лексическое, и подстрокой не берётся.
  #
  # Границу «предлагается против требуется» разбирает промпт LLM-обогатителя явно
  # (`docs/modules/llm-enricher.md`), и замер D4 дал там 0.5–1.3% ложных
  # заполнений. Поэтому сертификаты этого источника оставлены правилами пустыми:
  # пусть их заполняет слой, который умеет читать контекст. Пустое поле честнее
  # уверенно неверного — `tests/test_snapshot.py` про это же.
  - key: padi
    patterns: []
  - key: ssi
    patterns: [SSI]
  - key: imca
    patterns: [IMCA]
  - key: hse_diving
    patterns: [HSE diving, HSE diver]

