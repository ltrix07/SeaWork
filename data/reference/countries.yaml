  # --- Наблюдалось на PADI Dive Jobs (задача A5, 22.09.2026) ---
  # Список выведен из первых сегментов поля location, по убыванию частоты.
  # Восемь значений оттуда странами не являются — это адреса, попавшие первым
  # сегментом («40 Marsh Street», «Hyatt Place»); они намеренно не заводятся
  # и остаются неопознанными.
  - code: MV
    names: [Maldives]
  - code: GR
    names: [Greece]
  - code: AU
    names: [Australia]
  - code: LK
    names: [Sri Lanka]
  - code: CA
    names: [Canada]
  - code: AE
    names: [United Arab Emirates, UAE]
  - code: EG
    names: [Egypt]
  - code: DO
    names: [Dominican Republic]
