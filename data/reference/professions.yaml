# Matching picks the LONGEST alias that occurs in the text, not the first row in this
# file, so entries can be added in any order. Keep aliases specific: a short generic
# alias ("officer") will lose to a longer specific one ("chief officer") wherever both
# match, which is the intended behaviour.
#
# Granularity deliberately differs by segment. Cruise postings expose a department
# ("Galley", "Housekeeping"), so department-level keys are enough. Merchant fleet
# postings expose a rank, and rank carries seniority that Match Score must not lose:
# a Master and an Able Seaman are both deck crew and are not interchangeable.

professions:
  # --- Merchant fleet: deck ranks ---
  - key: master
    aliases: [master, captain]
  - key: chief_officer
    aliases: [chief officer, chief mate, first officer, first mate]
  - key: second_officer
    aliases: [second officer, second mate, 2nd off]
  - key: third_officer
    aliases: [third officer, third mate, 3rd off, jdpo]
  - key: deck_officer
    aliases: [deck officer, watch officer]
  - key: able_seaman
    aliases: [able seaman, ordinary seaman, lasher, deckhand]
  - key: boatswain
    aliases: [boatswain, bosun]
  - key: barge_pilot
    aliases: [barge pilot]
  - key: crane_operator
    aliases: [crane operator, excavator operator]

  # --- Merchant fleet: engine ranks ---
  - key: chief_engineer
    aliases: [chief engineer, cheng]
  - key: second_engineer
    aliases: [second engineer, 2nd engineer]
  - key: third_engineer
    aliases: [third engineer, 3rd engineer]
  - key: fourth_engineer
    aliases: [fourth engineer, 4th engineer]
  - key: electro_technical_officer
    aliases: [electro-technical officer, electrical engineer, eto]
  - key: gas_engineer
    aliases: [gas engineer]
  - key: motorman
    aliases: [motorman, oiler, wiper, pumpman, donkerman]
  - key: fitter
    aliases: [fitter, welder]

  # --- Merchant fleet: catering ---
  - key: ship_cook
    aliases: [chief cook, ship cook, mess boy, messmaid]
  - key: steward
    aliases: [steward, stewardess, steward (-ess)]

  # --- Cruise: department level ---
  - key: galley
    aliases: [galley, chef, cook, baker, butcher, culinary, pastry]
  # "Shorex" is the industry contraction for shore excursions; the desk is part of
  # guest services rather than a department of its own.
  - key: guest_services
    aliases: [guest svc, guest service, receptionist, concierge, front desk, shorex,
              shore excursion]
  - key: housekeeping
    aliases: [housekeeping, stateroom, laundry, cleaner]
  # Rooms Division is the combined cabin/front-office service on a liner and covers
  # roles from attendant to divisional manager, so it is not the same thing as
  # housekeeping. Kept separate because Princess uses it for 32 postings.
  - key: rooms_division
    aliases: [rooms division, florist rooms]
  - key: beverage_service
    aliases: [beverage svc, fb svc, beverage, bartender, bar server, sommelier]
  - key: entertainment
    aliases: [entertainment, musician, dancer, youth staff, broadcast]
  - key: restaurant_service
    aliases: [restaurant, waiter, dining, maitre]
  - key: human_resources
    aliases: [human resources, human resource, hr manager, crew officer]
  - key: marine_engineering
    aliases: [technical, engineer, electrician, refrigeration, plumber, fitter]
  - key: deck
    aliases: [deck, officer, bosun, sailor, carpenter]
  - key: medical
    aliases: [doctor, nurse, medical]
  - key: spa_and_fitness
    aliases: [spa, fitness, therapist, trainer, onsen]
  - key: security
    aliases: [security]
  - key: retail
    aliases: [retail, shop]
  # Photography on a liner is its own career ladder, not a shop job. It used to be
  # an alias of retail, which was simply wrong: 12 Princess roles landed there.
  - key: photographer
    aliases: [photographer, photo manager, photo supervisor, photo video]
  # Provisioning. The compound titles are listed in full on purpose: the bare word
  # "master" is an alias of the ship's Master, and "Provision Master" contains it.
  # Longest-alias-wins then resolves the collision in favour of these entries —
  # without them a provisioning clerk is matched to the captain's profession.
  - key: provisions
    aliases: [provision master, provisions, storekeeper, store keeper, stores]
  # Hotel-side maintenance. "Fitter Carpet" is a carpet fitter and must not reach
  # marine_engineering, whose "fitter" alias means the engine-room trade.
  - key: hotel_maintenance
    aliases: [fitter carpet, carpet fitter, upholsterer, tailor]

# --- Осознанно не заведено ---
# Решено 20.07.2026 при подключении Princess Cruises. Завести, если встретится
# в других источниках — тогда это уже отраслевая профессия, а не особенность
# одного работодателя.
#
#   Finance (Finance Director/Manager/Specialist) — 4 вакансии у Princess.
#   Activity Team (Activity Staff)                — 2 вакансии у Princess.

  # --- Дайвинг, наблюдалось на PADI Dive Jobs (задача B2) ---
  # Ранги PADI образуют лестницу: Divemaster ведёт группы, Instructor обучает,
  # Course Director готовит инструкторов. Для матчинга различаем первые два —
  # это разные вакансии с разными требованиями, — а Course Director держим
  # инструктором: отдельная вакансия на него одна на весь корпус.
  - key: dive_instructor
    aliases: [scuba instructor, dive instructor, diving instructor, freediver instructor,
              course director, owsi, msdt, idc staff]
  # "dive master" в два слова пишут не реже, чем слитно. Оба алиаса длиннее, чем
  # "master" у судового капитана, и побеждают его по правилу самого длинного.
  - key: divemaster
    aliases: [divemaster, dive master]
  # Ключа dive_guide здесь намеренно нет. Рубрика «Dive Guide» на PADI стоит у 13
  # объявлений, и у 13 из 13 в заголовке написано Instructor: работодатель
  # складывает туда вакансии инструкторов. Метка источника противоречит его же
  # тексту, поэтому как сигнал не годится — без ключа записи падают на заголовок
  # и попадают в dive_instructor, то есть туда, где им место. Завести обратно,
  # если появится источник, у которого гид действительно отдельная вакансия.
  # Обслуживание снаряжения и забивка баллонов — отдельная работа в дайв-центре,
  # к судовому fitter отношения не имеет.
  - key: dive_technician
    aliases: [equipment technician, service technician, fill station, boat mechanic]
