- profile_id: yacht_steward_partial
  profile_hash: 448c1b8fbedc8bb6
  opportunity_id: 73
  stratum: zero
  employer: Holland America Line
  description: 'This is a seasonal position intended for periodic and holiday coverage
    and is not a full time position. Contracts are offered based on business needs
    and will not follow a set or recurring schedule.

    The Activities Crew is at the heart of the onboard entertainment experience, bringing
    energy, enthusiasm, and fun to every event. This role is perfect for individuals
    who love engaging with people of all ages, creating memorable moments through
    a diverse range of activities. Whether hosting lively game shows, leading interactive
    trivia, organizing themed parties, or facilitating kids’ activities, games, and
    crafts, you’ll play a key role in ensuring every guest has an unforgettable experience.

    Reporting to the Cruise Director, you’ll support the planning and execution of
    a variety of entertainment and recreation programs while ensuring seamless operations
    and high guest participation. This role requires strong communication skills,
    adaptability, and a passion for hospitality. If you enjoy being in the spotlight,
    keeping the energy high, and making every interaction count, this is your chance
    to bring the cruise experience to life.

    Contract Length

    Seasonal contracts may range from

    1 week to 6 months

    , depending on operational needs. Unlike our full time shipboard positions, Seasonal
    contracts do not have a standard contract length. Opportunities are offered based
    on business demand and your availability, allowing for greater flexibility for
    both the opperation and our crew members.


    Key Job Responsibilities

    Host and assist with Kids and Family entertainment and recreational activities,
    including and not limited to game shows, trivia, bingo, line dancing, sports tournaments,
    themed parties, amd other events or activites directed by the Cruise Director.

    Partner with Youth Host to lead Kids Club activities and events during high kid
    count seasons and holiday periods. Including monitoring the Youth Center.

    Engage with guests of all ages to promote participation, ensure a welcoming atmosphere,
    and gather feedback to enhance the activities program.

    Support the development and organization of daily event schedules, working with
    the Activities Manager to ensure smooth execution.

    Manage resources, including equipment and supplies, ensuring they are properly
    maintained and available when needed.

    Maintain compliance with health, safety, security, and environmental policies.

    Make concise, engaging public announcements as needed to inform and excite guests.

    Work collaboratively with other departments to enhance the overall onboard experience.

    Maintain a professional appearance in line with company dress standards.

    Adapt quickly to schedule changes, last-minute adjustments, and unexpected challenges
    while keeping a positive guest experience at the forefront.

    Assist in other entertainment areas as directed by leadership.


    Experience

    Minimum Experience:

    Three years of experience in a related guest service focused field.

    One year of experience in an entertainment specific field.

    Experience hosting live events, activities, or stage shows - both on and off microphone.

    Exceptional verbal, written, and presentation skills.

    Experience hosting live events, activities, or stage shows.

    Ability to work effectively both independently and as part of a team.

    Experience using computers for a variety of tasks.

    Competency in Microsoft applications including Word, Excel, and Outlook.

    Demo Reel:

    To be considered for this position, it is strongly recommended you submit a link
    to a demo reel or video presentation that showcases your polished hosting style,
    engaging personality, and ability to connect with and entertain a refined and
    diverse audience.'
