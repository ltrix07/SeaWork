    \ members.\nWe appreciate your patience as we carefully review each candidate.\n\
    Set a course for adventure with Princess Cruises! The employer of choice in the\
    \ cruise industry, our fleet of Love Boats offer exceptional facilities and extensive\
    \ professional development and recreational programs for our valued teammates\
    \ who hail from more than 60 countries around the globe.\nAn iconic brand beloved\
    \ by millions, we love people who love what they do and work together to help\
    \ our guests create a lifetime of wonderful memories while providing friendly,\
    \ attentive and authentic service like only Princess can.\nAs a member of the\
    \ Princess Family, you’ll enjoy a truly adventurous career with excellent incentives,\
    \ unlimited opportunities for growth, and ports of call that will leave you breathless.\n\
    \nKey Responsibilities\nResponsibly ensures the physical security of all stores/provision\
    \ areas. Always maintains accurate records.\nRegularly participates in physical\
    \ inventories for all stores per corporate policies and procedures\nTimely and\
    \ accurately investigates, records, and reports stock variances.\nEnsures the\
    \ accuracy of Crunchtime about orders, receipts, adjustments, and consumptions.\n\
    Ensures proper stock rotation procedures and storage methods are carried out to\
    \ minimize loss.\nFully understands and oversees defrost-cycles for all refrigerators\
    \ and deep freezers; takes quick and appropriate action if a malfunction occurs.\n\
    Carefully establishes the internal requisition schedule based on the length of\
    \ the voyage and determines appropriate pick-up times and locations.\nAccurately\
    \ prepares all Master Orders for hotel supplies including linen, uniforms, food,\
    \ and beverages per the schedule provided by Corporate Purchasing.\nRegularly\
    \ reviews preliminary and final PDF Purchase Orders sent to the vessel before\
    \ loading; promptly reviews discrepancies with Corporate Purchasing and shipboard\
    \ departments.\nObserves each crewmember’s performance using the role description\
    \ as a guide and deliver prompt and appropriate correction, improvement, or reinforcement.\
    \ Coaches and develops skilled, engaged team members to become the Consummate\
    \ Host.\nRegularly circulates among front-of-house and back-of-house areas to\
    \ resolve irregularities, problems, and special situations in which staff members\
    \ require senior-level guidance or assistance.\nMaintains regular, clear, and\
    \ effective communication with onboard Food and Beverage Management and other\
    \ onboard departments.\nActs as a Company representative and always portrays a\
    \ positive image of Princess Cruises to all passengers, officers, and crew .\n\
    \nSkills, Knowledge & Expertise\nDegree in Hotel Management/Hospitality Management\
    \ preferred although appropriate experience in lieu thereof is sufficient.\nAt\
