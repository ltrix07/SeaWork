        Demonstrated motivation to excel in all aspects of job duties and responsibilities.

        A personable communicator with excellent social skills and a warm, friendly,
        and caring personality.

        Commitment to establishing and maintaining courteous and professional working
        relationships in a diverse cultural environment.

        Possession of an STCW Ship’s Cook Certificate is recommended for this role.
        Candidates holding this certification demonstrate compliance with international
