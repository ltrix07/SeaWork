  description: "Set a course for adventure with Princess Cruises!\nAs one of the world's\
    \ leading cruise brands and an employer of choice in the industry, Princess Cruises\
    \ offers exciting career opportunities aboard a fleet recognized for exceptional\
    \ guest experiences and innovation at sea.\nOur teammates represent more than\
    \ 60 nationalities and bring diverse talents, perspectives, and experiences to\
    \ life every day. Together, we create memorable moments for guests while building\
    \ rewarding careers in a supportive, inclusive, and globally connected environment.\n\
    At Princess Cruises, we are passionate about delivering exceptional service and\
    \ creating unforgettable experiences. We are looking for individuals who share\
    \ our commitment to excellence, thrive in a team environment, and take pride in\
    \ making a positive impact on our guests and fellow teammates.\nAs part of the\
    \ Princess family, you'll enjoy competitive benefits, professional development\
    \ opportunities, international career pathways, and the unique opportunity to\
    \ explore some of the world's most breathtaking destinations.\n\uFEFF\n\uFEFF\n\
    \nKey Responsibilities\nLead the overall Hotel department operation onboard, ensuring\
    \ all hotel functions deliver an exceptional, guest-centric experience in line\
    \ with Princess Cruises standards.\nDirect the day-to-day performance of senior\
    \ Hotel leadership, providing clear direction, support, and accountability across\
    \ Guest Services, Rooms Division, Food & Beverage, Entertainment, and revenue\
    \ outlets.\nPartner closely with the shoreside Hotel Operations Director to align\
    \ shipboard operations with company strategy, performance targets, and brand initiatives.\n\
    Plan, coordinate, and document current and future itinerary deployments, proactively\
    \ identifying opportunities and risks related to revenue, demographics, logistics,\
    \ and clearance requirements.\nOversee planning for dry docks, wet docks, and\
    \ other maintenance periods, working with the Technical department to minimise\
    \ guest impact while ensuring hotel spaces remain safe, functional, and visually\
    \ appealing.\nMonitor Hotel Key Performance Indicators, analyse trends, and lead\
    \ timely action plans to improve guest satisfaction, operational efficiency, and\
    \ financial performance.\nOversee and continuously improve the embarkation, disembarkation,\
    \ tender, and shore excursion experience, ensuring smooth operations and consistent\
    \ delivery of the Princess product.\nCollaborate with the Chief Engineer Officer\
    \ and Technical team to maintain the appearance, reliability, and functionality\
    \ of all hotel facilities, equipment, and public areas.\nWork with the Senior\
    \ Doctor to ensure the Medical department’s guest-facing services, billing, inventory\
    \ control, and regulatory records meet company, CDC, and USPH standards.\nOwn\
    \ the financial performance of all hotel revenue-generating areas, ensuring budgets,\
    \ forecasts, and targets are achieved through effective planning, execution, and\
    \ cost control.\nGuide onboard revenue managers and senior Hotel leaders to optimise\
    \ pricing, programming, and promotions, adjusting quickly to guest mix, voyage\
    \ profile, and performance trends.\nControl hotel-related costs, inventories,\
    \ and consumption, ensuring compliance with company policies while maintaining\
    \ product and service quality.\nMaintain and regularly update capital expenditure\
    \ and hotel maintenance project plans, providing accurate, timely reports to the\
    \ Hotel Operations Director.\nSet clear expectations and complete fair, timely\
    \ performance appraisals for senior Hotel leaders, using observed behaviours and\
    \ results as the basis for feedback and development.\nObserve, coach, and develop\
    \ hotel team members at all levels, reinforcing role standards and building a\
    \ culture of accountability, engagement, and “Consummate Host” service.\nHold\
    \ regular one-to-one meetings with direct reports to review performance, discuss\
    \ operational priorities, support wellbeing, and align on personal development\
    \ and career goals.\nAct as a visible brand ambassador for Princess Cruises, maintaining\
    \ professional, positive relationships with guests, officers, and crew at all\
    \ times.\nFoster an inclusive, respectful, and high-performing culture across\
    \ all hotel functions, valuing diversity of backgrounds, cultures, and perspectives.\n\
    Lead regular hotel inspections and product reviews, ensuring service, cleanliness,\
    \ safety, and maintenance standards are consistently met or exceeded.\nReview\
    \ guest feedback (including Passenger Relations data, Passenger in Focus files,\
    \ and Let Us Know forms), identify trends and root causes, and drive cross-functional\
    \ action plans to surprise and delight guests.\nChair the shipboard CRUISE Steering\
    \ Committee, ensuring all meetings, initiatives, and engagement activities are\
    \ delivered effectively and support the onboard culture and guest experience.\n\
    \nSkills, Knowledge & Expertise\nExtensive hospitality leadership experience\n\
    with at least 10 years in progressive management roles within premium hotel, resort,\
    \ or cruise environments, covering multiple hotel disciplines (Guest Services,\
    \ Rooms Division, Food & Beverage, Entertainment, and revenue outlets).\nProven\
    \ track record of leading large, multicultural teams\n, with the ability to inspire,\
    \ coach, and hold senior leaders accountable while fostering a positive, inclusive,\
    \ and high-performance culture.\nStrong business and commercial acumen\n, including\
    \ experience in budgeting, forecasting, cost control, and revenue optimisation\
    \ across multiple profit centres.\nDemonstrated expertise in guest experience\
    \ management\n, with a passion for creating memorable, guest-centric service and\
    \ a data-informed approach to resolving issues and improving satisfaction scores.\n\
    Advanced organisational and strategic planning skills\n, with the ability to balance\
    \ long-term initiatives (itinerary planning, maintenance periods, capital projects)\
    \ with day-to-day operational demands.\nSolid understanding of public health,\
    \ environmental, and safety standards\n(e.g. USPH, CDC, HESS), with experience\
    \ embedding compliance into day-to-day hotel operations.\nExperience operating\
    \ in highly regulated, safety-critical environments\nsuch as cruise, maritime,\
    \ aviation, or large-scale hospitality operations is highly regarded.\nExceptional\
    \ communication and influencing skills\n, with the ability to present confidently,\
    \ build trust with stakeholders at all levels, and navigate sensitive or complex\
    \ guest and crew situations.\nProven capability in change leadership\n, including\
    \ implementing new brand initiatives, systems, and service standards while maintaining\
    \ engagement and performance.\nHighly resilient and calm under pressure\n, able\
    \ to make sound decisions quickly in a fast-paced, 24/7 operational environment.\n\
    Strong analytical skills\n, comfortable working with KPIs, financial reports,\
    \ and guest feedback data to identify trends, set priorities, and drive continuous\
    \ improvement.\nHigh level of integrity, discretion, and sound judgement\n, consistently\
    \ role-modelling company values and professional behaviour.\nFluent written and\
    \ spoken English\n; additional languages are an advantage in a diverse, international\
    \ guest and crew environment.\nBachelor’s degree in hospitality management, business\
    \ administration, or a related field\n(or equivalent professional experience);\
    \ advanced qualifications are an advantage.\n\nJob Benefits\nEmbark on a career\
    \ adventure like no other! As part of the Princess Cruises team, you’ll enjoy:\n\
    A competitive salary package.\nYour own comfortable single cabin - your private\
    \ space to relax and recharge.\nCompany-paid travel to and from the ship, so you\
    \ can focus on the journey ahead.\nAccess to exclusive areas and benefits onboard\
    \ (depending on the rank and occupational group).\nA vibrant recreation and welfare\
    \ program designed to support your well-being and work-life balance.\nAccess to\
    \ exceptional learning and development opportunities to grow your skills and advance\
    \ your career.\nThe chance to travel the world, exploring exciting destinations\
    \ while doing what you love.\nA welcoming, inclusive, and dynamic work environment\
    \ where your contributions are valued.\nJoin us and become part of a global team\
    \ that’s passionate about delivering unforgettable experiences—both for our guests\
    \ and for one another.\n\uFEFF\n\uFEFF"
