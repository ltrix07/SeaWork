- profile_id: browsing
  profile_hash: 5cfd52d95b9d1837
  opportunity_id: 392
  stratum: none
  employer: Princess Cruises
  description: "Set a course for adventure with Princess Cruises!\nAs one of the world's\
    \ leading cruise brands and an employer of choice in the industry, Princess Cruises\
    \ offers exciting career opportunities aboard a fleet recognized for exceptional\
    \ guest experiences and innovation at sea.\nOur teammates represent more than\
    \ 60 nationalities and bring diverse talents, perspectives, and experiences to\
    \ life every day. Together, we create memorable moments for guests while building\
    \ rewarding careers in a supportive, inclusive, and globally connected environment.\n\
    At Princess Cruises, we are passionate about delivering exceptional service and\
    \ creating unforgettable experiences. We are looking for individuals who share\
    \ our commitment to excellence, thrive in a team environment, and take pride in\
    \ making a positive impact on our guests and fellow teammates.\nAs part of the\
    \ Princess family, you'll enjoy competitive benefits, professional development\
    \ opportunities, international career pathways, and the unique opportunity to\
    \ explore some of the world's most breathtaking destinations.\n\uFEFF\n\uFEFF\n\
    \nKey Responsibilities\nLead, mentor, and develop a diverse Entertainment and\
    \ Activity team, setting clear expectations and ensuring all teammates consistently\
    \ deliver a guest experience that reflects Princess Cruises’ brand standards and\
    \ values.\nAct as the onboard Brand Ambassador and primary entertainment host,\
    \ confidently fronting major guest-facing events, shows, and activities with a\
    \ charismatic, engaging, and professional stage presence.\nDesign, plan, and oversee\
    \ the daily and voyage-long entertainment and activities program – including Youth\
    \ and Teens, Guest Activities, Onboard Media, Enrichment Programs, Production\
    \ Services, Music Services, and Guest Entertainers – ensuring it is well-balanced,\
    \ inclusive, and aligned with the guest profile and itinerary.\nChampion the MedallionClass\
    \ experience by embedding its products, services, and applications into the entertainment\
    \ program, driving adoption through training, coaching, and role-modelling.\n\
    Foster a personalised, guest-centric culture by actively engaging with guests,\
    \ identifying opportunities to reduce friction points, and collaborating with\
    \ Entertainment Managers to tailor and enhance experiences that exceed entertainment\
    \ targets.\nOversee the quality, consistency, and delivery of all entertainment\
    \ products and experiences, using guest feedback, Net Promoter scores, and operational\
    \ KPIs to continuously improve performance.\nPartner closely with shipboard leadership\
    \ and cross-functional departments to align entertainment programming with wider\
    \ onboard initiatives, brand campaigns, and operational requirements.\nManage\
    \ departmental budgets, costs, and inventory in line with company guidelines,\
    \ identifying opportunities for cost efficiencies without compromising the guest\
    \ experience.\nConduct regular meetings and maintain strong collaboration with\
    \ the Technical department to prioritise, coordinate, and follow up on repairs,\
    \ maintenance, and technical readiness for all entertainment venues and equipment.\n\
    Communicate company updates, strategies, and performance results to the Entertainment\
    \ team through effective briefings and use of onboard technology, ensuring clarity,\
    \ alignment, and engagement.\nPromote and uphold a safe, secure, and healthy working\
    \ and guest environment by adhering to and championing all Health, Environmental,\
    \ Safety, and Security (HESS) policies and procedures.\n\nSkills, Knowledge &\
    \ Expertise\nExtensive experience planning, organizing, and delivering large-scale\
    \ events, activities, shows, and theatrical productions, ideally in a cruise,\
    \ resort, or hospitality environment.\nExceptional stage presence with a confident,\
    \ charismatic, and energetic hosting style that feels natural, engaging, and easy\
    \ to watch, with the ability to adapt tone and approach to diverse audiences.\n\
    Proven leadership experience managing large, diverse, and multicultural teams,\
    \ with a track record of coaching, motivating, and developing others to deliver\
    \ outstanding guest experiences.\nStrong commercial and operational acumen, including\
    \ experience managing departmental budgets, controlling inventory, and making\
    \ data-informed decisions using KPIs, guest feedback, and Net Promoter scores.\n\
    Excellent communication and interpersonal skills, with the ability to build rapport\
    \ quickly, influence stakeholders, and represent the brand confidently in all\
    \ guest and teammate interactions.\nHighly organized and resilient, with the ability\
    \ to manage multiple concurrent events and priorities in a fast-paced, live entertainment\
    \ environment while maintaining high standards of quality and safety.\nSound understanding\
    \ of health, safety, and public health standards within an entertainment or hospitality\
    \ setting, with a commitment to upholding HESS protocols and company policies.\n\
    Comfortable working with entertainment technology, audio-visual systems, and digital\
    \ tools used to plan, promote, and deliver onboard entertainment experiences (training\
    \ can be provided where required).\nCulturally aware, inclusive, and guest-centric\
    \ mindset, with a genuine passion for creating memorable experiences and surprising\
    \ and delighting guests from around the world.\nProfessional appearance and demeanor,\
    \ with the confidence to act as a visible ambassador for Princess Cruises at all\
    \ times.\n\nJob Benefits\nEmbark on a career adventure like no other! As part\
    \ of the Princess Cruises team, you’ll enjoy:\nA competitive salary package.\n\
    Your own comfortable single cabin - your private space to relax and recharge.\n\
    Company-paid travel to and from the ship, so you can focus on the journey ahead.\n\
    Access to exclusive areas and benefits onboard (depending on the rank and occupational\
    \ group).\nA vibrant recreation and welfare program designed to support your well-being\
    \ and work-life balance.\nAccess to exceptional learning and development opportunities\
    \ to grow your skills and advance your career.\nThe chance to travel the world,\
    \ exploring exciting destinations while doing what you love.\nA welcoming, inclusive,\
    \ and dynamic work environment where your contributions are valued.\nJoin us and\
    \ become part of a global team that’s passionate about delivering unforgettable\
    \ experiences—both for our guests and for one another.\n\uFEFF\n\uFEFF"
