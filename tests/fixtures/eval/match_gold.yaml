- profile_id: onboarded_working
  profile_hash: 7fd908b993085d66
  opportunity_id: 347
  stratum: top
  employer: Princess Cruises
  description: "Set a course for adventure with Princess Cruises!\nAs one of the world's\
    \ leading cruise brands and an employer of choice in the industry, Princess Cruises\
    \ offers exciting career opportunities aboard a fleet recognized for exceptional\
    \ guest experiences and innovation at sea.\nOur teammates represent more than\
    \ 60 nationalities and bring diverse talents, perspectives, and experiences to\
    \ life every day. Together, we create memorable moments for guests while building\
    \ rewarding careers in a supportive, inclusive, and globally connected environment.\n\
    At Princess Cruises, we are passionate about delivering exceptional service and\
    \ creating unforgettable experiences. We are looking for individuals who share\
    \ our commitment to excellence, thrive in a team environment, and take pride in\
    \ making a positive impact on our guests and fellow teammates.\nAs part of the\
    \ Princess family, you'll enjoy competitive benefits, professional development\
    \ opportunities, international career pathways, and the unique opportunity to\
    \ explore some of the world's most breathtaking destinations.\n\uFEFF\n\uFEFF\n\
    \nKey Responsibilities\nConsistently assists the Guest Services teams with daily\
    \ operational inquiries from Japanese-speaking passengers.\nProvides a positive\
    \ first impression to every passenger and staff member through a warm, welcoming\
    \ greeting.\nConsistently maintains high visibility during published desk hours,\
    \ socializing with passengers, answering general inquiries, and providing support\
    \ to all passengers, with a particular focus on Japanese-speaking passengers.\n\
    Promptly and meaningfully addresses and acts upon all passenger inquiries regarding\
    \ onboard amenities and services, with a focus on Japanese-speaking passengers.\n\
    Ensures all complaints from non-English-speaking passengers are listened to with\
    \ empathy and understood, showing genuine interest at all times.\nTakes ownership\
    \ of each complaint, following up with the passenger in question. Accurately lists\
    \ specific details of the resolution when updating the Passenger in Focus file,\
    \ and keeps the Guest Relations Manager informed at all times.\nAlways provides\
    \ the Guest Services teams with information, translated documents, and other tools\
    \ to assist Japanese-speaking passengers.\nAlways holds daily desk hours as published\
    \ or as directed by the Guest Services Director.\n\uFEFF\n\uFEFF\n\nSkills, Knowledge\
    \ & Expertise\nProfessional Experience\n: At least 1 year of experience as a Front\
    \ Desk Receptionist or Guest Services Agent in a 4- or 5-star hotel, resort, or\
    \ cruise ship environment.\nEducation\n: Graduate of a recognized hotel or business\
    \ school is preferred, or equivalent experience in hospitality or customer-facing\
    \ roles.\nLanguage Skills\n: Excellent verbal and written communication skills\
    \ in English and Japanese, with the ability to confidently handle inquiries, concerns,\
    \ and complaints in both languages.\nCustomer Service Excellence\n: Strong foundation\
    \ in guest service with a genuine passion for delivering warm, personalized, and\
    \ professional service; able to remain calm, empathetic, and solution-focused\
    \ under pressure.\nCultural Awareness\n: High level of cultural sensitivity and\
    \ awareness when interacting with Japanese guests and a diverse, multicultural\
    \ guest and teammate population.\nProblem Solving & Ownership\n: Demonstrated\
    \ ability to take ownership of guest issues, follow through on resolutions, and\
    \ document outcomes clearly and accurately.\nCommunication & Interpersonal Skills\n\
    : Personable communicator with outstanding social skills, active listening ability,\
    \ and a warm, approachable demeanor.\nTechnical Skills\n: Proficiency in computer-based\
    \ programs and systems (e.g. MS Office, Outlook, web-based applications); previous\
    \ experience with hotel or guest service management systems is an advantage.\n\
