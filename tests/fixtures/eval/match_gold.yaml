- profile_id: onboarded_working
  profile_hash: 7fd908b993085d66
  opportunity_id: 278
  stratum: low
  employer: Princess Cruises
  description: 'By applying to this position, your application will be submitted to
    Seven Seas, one of Princess Cruises official Hiring Partners based in Central
    America. A recruiter from Seven Seas will contact you soon if your qualifications
    align with our requirements for this position.

    As the world''s leading cruise line, we understand that our guests have high expectations
    of us, and we have high expectations of our team members.

    We appreciate your patience as we carefully review each candidate.

    Set a course for adventure with Princess Cruises! The employer of choice in the
    cruise industry, our fleet of Love Boats offer exceptional facilities and extensive
    professional development and recreational programs for our valued teammates who
    hail from more than 60 countries around the globe.

    An iconic brand beloved by millions, we love people who love what they do and
    work together to help our guests create a lifetime of wonderful memories while
    providing friendly, attentive and authentic service like only Princess can.

    As a member of the Princess Family, you’ll enjoy a truly adventurous career with
    excellent incentives, unlimited opportunities for growth, and ports of call that
    will leave you breathless.


    Key Responsibilities

    Delights passengers by delivering the best Neapolitan-style Pizza at Sea, From
    traditional Margherita and pepperoni to the daily specials.

    Responsible for culinary operations in the Top-Deck pizzeria always ensuring Neapolitan-style
    pizza is hand-tossed and freshly baked right on deck according to Company recipes
    and preparation methods.

    Always monitors the consumption of ingredients required for daily pizza production,
    minimizes food waste, and plans orders accordingly. Informs Executive Chef when
    fluctuations occur.

    Effectively supervises the Demi Chef De Partie Pizza and Commis Chef during baking
    and mise-en-place operations and provides the required training/coaching classes.

    Always ensures that Pizza recipe files are maintained and available to assigned
    staff.

    Share responsibility with the Demi Chef de Partie Pizza for managing the budget
    and achieving cost targets in the Pizzeria as directed by the Chief Baker and
    Executive Chef.

    Continually strives to improve on production methods and skills, culinary techniques,
    menu and recipe knowledge, product-holding techniques, and presentation and delivery
    of the pizza products.

    Observes each teammate’s performance using role descriptions as a guide and identifies
    top performers and mentors them for career advancement or promotion.

    Continually trains and coaches pizza-making staff in production methods, baking
    techniques, menu and recipe knowledge, product-holding techniques, and presentation
    and delivery of the product.


    Skills, Knowledge & Expertise

    Minimum 5 years of experience as a "Pizzaiolo" from high-volume handmade pizza
    production.

    Formal Pizzaiolo Certification (preferred).

    Solid knowledge of the Neapolitan Pizza process and procedures, including dough
    preparation methods, baking techniques, and toppings.

    Solid knowledge of different Pizza styles, from traditional Margherita and Pepperoni
    to other specialty Pizzas.

    Good English language skills, both verbal and written.

    Understanding of the foundation of guest service; ability and willingness to deliver
    outstanding service to our guests.

    Motivation to excel in all aspects of job duties and responsibilities.

    Personable communicator with outstanding social skills and a warm, friendly, and
    caring personality.

    Ability to continuously surprise and delight guests throughout their cruise experience.

    Commitment to establish and maintain courteous and professional working relationships
    in a diverse cultural environment.


    Additional Information

    This position involves regular physical activity, including standing for extended
    periods and lifting or moving heavy items in line with operational requirements.

    Embark on a career adventure like no other! As part of the Princess Cruises team,
    you’ll enjoy:

    A competitive salary package.

    Your own comfortable double cabin - your private space to relax and recharge.

    Company-paid travel to and from the ship, so you can focus on the journey ahead.

    Access to exclusive areas and benefits onboard (depending on the rank and occupational
    group).

    A vibrant recreation and welfare program designed to support your well-being and
    work-life balance.

    Access to exceptional learning and development opportunities to grow your skills
    and advance your career.

    The chance to travel the world, exploring exciting destinations while doing what
    you love.

    A welcoming, inclusive, and dynamic work environment where your contributions
    are valued.

    Join us and become part of a global team that’s passionate about delivering unforgettable
    experiences—both for our guests and for one another.'
