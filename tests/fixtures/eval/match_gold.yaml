- profile_id: yacht_steward_partial
  profile_hash: 448c1b8fbedc8bb6
  opportunity_id: 238
  stratum: top
  employer: Princess Cruises
  description: 'By applying to this position, your application will be submitted to
    InSearch HR, one of Princess Cruises official Hiring Partners based in Mexico.
    A recruiter from In Search HR will contact you soon if your qualifications align
    with our requirements for this position.

    As the world''s leading cruise line, we understand that our guests have high expectations
    of us, and we have high expectations of our team members.

    We appreciate your patience as we carefully review each candidate.

    Set a course for adventure with Princess Cruises! The employer of choice in the
    cruise industry, our fleet of Love Boats offer exceptional facilities and extensive
    professional development and recreational programs for our valued teammates who
    hail from more than 60 countries around the globe.

    An iconic brand beloved by millions, we love people who love what they do and
    work together to help our guests create a lifetime of wonderful memories while
    providing friendly, attentive and authentic service like only Princess can.

    As a member of the Princess Family, you’ll enjoy a truly adventurous career with
    excellent incentives, unlimited opportunities for growth, and ports of call that
    will leave you breathless.


    Key Responsibilities

    Always follows Princess Cruises’ operational methods and seeks advice from the
    Galley Supervisor if necessary.

    Follows USPHS principles and Princess Cruises procedures at all times.

    Works as part of a cleaning team responsible for consistently cleaning and sanitizing
    specific galley equipment and service locations, including but not limited to
    pots, pans, and other galley equipment (Most heavy pot in the main galley is 30.5lbs
    and pastry heaviest mixing bowl is 38.6lbs and 71lbs)

    Always recycles cooking service equipment before, during, and after service.

    Assist when required to unload and store food deliveries (average weight 50lbs
    to 60lbs)

    Willingly participates in scheduled deep cleaning in addition to everyday cleaning
    operations.

    Always treats all equipment used during the cleaning process and all equipment
    to be cleaned with care to prevent damage.

    Reports equipment defects to the Galley Supervisor / Executive Chef / Food Manager
    on a daily basis.

    Always performs all duties in accordance with applicable policies and procedures,
    USPHS and Fleet Regulations, and other internal, external, and governmental regulations
    as directed.

    Always conducts galley cleaning in compliance with Princess Cruises’ environmental
    regulations and objectives.

    Performs all General Emergency Organization duties as directed.

    Demonstrates commitment to the Company''s values, beliefs, goals, and initiatives.

    Acts as a Company representative and always portrays a positive image of Princess
    Cruises to all passengers, officers, and crew.

    Always maintains professional, effective, and motivated working relationships,
    taking into account differences in cultures, backgrounds, and individual personalities.


    Skills, Knowledge & Expertise

    At least one year of experience as Kitchen Steward or Dishwasher in large restaurants,
    hotels, or cruise industry.

    Working knowledge of cleaning and sanitation practices and procedures in the food
    service industry.

    Good oral and written command of the English language.

    Motivation to excel in all aspects of job duties and responsibilities.

    Personable communicator with outstanding social skills and a warm, friendly, and
    caring personality.

    Commitment to establish and maintain courteous and professional working relationships
    in a diverse cultural environment.


    Additional Information

    This position involves regular physical activity, including standing for extended
    periods and lifting or moving heavy items in line with operational requirements.

    Embark on a career adventure like no other! As part of the Princess Cruises team,
    you’ll enjoy:

    · A competitive salary package.

    · Your own comfortable double cabin - your private space to relax and recharge.

    · Company-paid travel to and from the ship, so you can focus on the journey ahead.

    · Access to exclusive areas and benefits onboard (depending on the rank and occupational
    group).

    · A vibrant recreation and welfare program designed to support your well-being
    and work-life balance.

    · Access to exceptional learning and development opportunities to grow your skills
    and advance your career.

    · The chance to travel the world, exploring exciting destinations while doing
    what you love.

    · A welcoming, inclusive, and dynamic work environment where your contributions
    are valued.

    Join us and become part of a global team that’s passionate about delivering unforgettable
    experiences—both for our guests and for one another.'
