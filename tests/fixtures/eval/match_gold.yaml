- profile_id: deckhand_to_officer
  profile_hash: 8ae39d42dc538bec
  opportunity_id: 1836
  stratum: zero
  employer: 30738 Diventures Lexington
  description: 'At Diventures, safety is our number one priority, and fun is our number
    one goal. We are in the relationship business, helping people build confidence,
    explore the underwater world, and create lifelong memories through scuba.

    We are looking for a

    Dive Professional

    who is passionate about teaching safe scuba, creating exceptional customer experiences,
    and helping students become confident, comfortable, and excited divers.

    As a Dive Professional, you will lead students through scuba education, build
    meaningful relationships, and represent the Diventures experience. You will use
    your knowledge, energy, and passion for diving to help customers grow through
    the four pillars of the SSI Diver Diamond:

    Knowledge, Skills, Equipment, and Experience

    .

    What You’ll Do

    Teach safe scuba while following all SSI, industry, and Diventures standards.

    Create a positive, engaging, and comfortable learning environment for students.

    Build strong relationships with customers by showing genuine curiosity about their
    diving goals.

    Help students understand the value of continuing education, dive experiences,
    travel, and owning their own total dive system.

    Use the Diventures sales floor as a teaching tool to connect education, equipment,
    and experience.

    Make product recommendations that support safe, comfortable, and confident diving.

    Promote local, national, and international dive opportunities.

    Ensure all required paperwork and forms are completed accurately before class.

    Arrive early and be prepared for classes, with classrooms and equipment ready
    for students.

    Maintain a clean, organized, and safe pool, classroom, rental, and training environment.

    Partner with teammates across scuba, retail, swim, service, and travel to create
    a seamless customer experience.

    Stay current with certifications, dues, industry standards, training methods,
    and Diventures offerings.

    What We’re Looking For

    The ideal candidate is:

    An effective and engaging teacher.

    Safety-focused and detail-oriented.

    Friendly, patient, reliable, and professional.

    Passionate about scuba and helping others grow as divers.

    Comfortable making education, equipment, and experience recommendations.

    A strong communicator who enjoys working with students and teammates.

    Collaborative, self-motivated, and willing to support the broader store team.

    Committed to representing Diventures positively in appearance, attitude, and professionalism.

    Required Competencies

    Dive Professional certification.

    Ability to remain current with all certifications and dues required to instruct
    courses.

    Why This Role Matters

    Dive Professionals are at the heart of the Diventures scuba experience. You help
    students move from curious beginners to confident divers by creating a safe, fun,
    and memorable learning experience.

    This role is more than teaching scuba. It is about building relationships, growing
    the dive community, and helping customers discover the knowledge, skills, equipment,
    and experiences that make diving a lifelong adventure.

    If you love scuba, enjoy teaching, and want to help others explore the underwater
    world safely and confidently, we would love to meet you.

    Pay details:

    $50-350 1099 independent contractor role. Per-student pay schedule (varies by
    class taught and group vs. private)

    Benefits: Purchase Benefits, Professional Liability Insurance, Sales Commissions,
    Fully- Comp’d International Travel (For Certified Trip Leaders)'
