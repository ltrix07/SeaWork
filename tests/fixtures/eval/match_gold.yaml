- profile_id: newcomer_cruise
  profile_hash: c83079d6956f1178
  opportunity_id: 232
  stratum: top
  employer: Princess Cruises
  description: "Set a course for adventure with Princess Cruises!\nAs one of the world's\
    \ leading cruise brands and an employer of choice in the industry, Princess Cruises\
    \ offers exciting career opportunities aboard a fleet recognized for exceptional\
    \ guest experiences and innovation at sea.\nOur teammates represent more than\
    \ 60 nationalities and bring diverse talents, perspectives, and experiences to\
    \ life every day. Together, we create memorable moments for guests while building\
    \ rewarding careers in a supportive, inclusive, and globally connected environment.\n\
    At Princess Cruises, we are passionate about delivering exceptional service and\
    \ creating unforgettable experiences. We are looking for individuals who share\
    \ our commitment to excellence, thrive in a team environment, and take pride in\
    \ making a positive impact on our guests and fellow teammates.\nAs part of the\
    \ Princess family, you'll enjoy competitive benefits, professional development\
    \ opportunities, international career pathways, and the unique opportunity to\
    \ explore some of the world's most breathtaking destinations.\n\uFEFF\n\uFEFF\n\
    \nKey Responsibilities\nSupport Beverage Operations Excellence\n: Assist the Bar\
    \ Manager and Assistant F&B Manager in delivering smooth, efficient beverage operations\
    \ across all venues, consistently meeting Service Excellence and financial targets.\n\
    Guest Experience & Service Recovery\n: Act as a visible presence in guest areas,\
    \ proactively engaging with guests, resolving service issues promptly, and ensuring\
    \ all feedback is captured, followed up, and escalated when required.\nMedallionClass\
    \ & Technology Enablement\n: Promote and support the effective use of MedallionClass\
    \ products, services, and applications to personalize the guest experience, reduce\
    \ service friction, and optimize venue capacity.\nOrder Flow & POS Accuracy\n\
    : Oversee accurate and timely entry of guest and teammate orders in the onboard\
    \ POS system, coaching teammates on best practices and troubleshooting basic system\
    \ issues.\nInventory, Stock & Cost Control\n: Support bar counts in high-volume\
    \ venues, monitor par levels, and assist with ordering to ensure the right products\
    \ are available at the right time while minimizing waste, overstocking, and expiries.\n\
    Revenue & Package Performance\n: Monitor daily and voyage beverage performance,\
    \ including package sales and promotions, and share insights with the Bar Manager\
    \ to identify upselling and revenue‑generating opportunities.\nEvent & Premium\
    \ Experience Support\n: Coordinate with the Bar and Restaurant teams to ensure\
    \ accurate setup, service, and reconciliation of premium events (e.g. Champagne\
    \ Waterfall, Chef’s Table, private functions, and catering transfers).\nSystems\
    \ & Reporting\n: Assist with the timely and accurate input of transfers, breakage,\
    \ and usage (B&U) in Crunchtime and other systems, highlighting discrepancies\
    \ or trends to the Bar Manager.\nCrew Bar & Cambusa Support\n: Support crew bar\
    \ and Cambusa operations in line with Princess Ways standards, ensuring accurate\
    \ documentation and transparent handling of crew sales and stock movements.\n\
    Workforce Planning & Scheduling\n: Contribute to effective scheduling by providing\
    \ input on operational needs, helping to align bar staffing with the food and\
    \ entertainment program, and supporting last‑minute adjustments.\nVenue Readiness\
    \ & Brand Standards\n: Conduct regular walk‑throughs of all beverage outlets to\
    \ confirm setup, ambiance, cleanliness, and equipment are in line with Princess\
    \ brand and Public Health standards, taking corrective action where needed.\n\
    Training, Coaching & Onboarding\n: Support the training and onboarding of new\
    \ beverage teammates, reinforcing Service Excellence, safety, and system standards,\
    \ and providing ongoing coaching on guest interaction and sales techniques.\n\
    Health, Safety & Compliance\n: Lead by example in following Responsible Service\
    \ of Alcohol (RSA), HESS, and Public Health requirements, promptly reporting incidents\
    \ and participating in drills and inspections as assigned.\n\nSkills, Knowledge\
    \ & Expertise\nFood & Beverage Leadership Experience\n: Minimum one (1) year of\
    \ experience as an Assistant Food & Beverage Manager, Bar Supervisor, or similar\
    \ supervisory role in a high‑volume hotel, resort, or cruise ship environment.\n\
    Operational & Financial Acumen\n: Strong analytical skills with the ability to\
    \ interpret daily and voyage‑level F&B performance, support cost control, and\
    \ contribute to revenue‑driving initiatives.\nService Recovery & Problem Solving\n\
    : Proven ability to handle guest complaints and service recovery situations calmly\
    \ and professionally, making sound decisions and following through to resolution.\n\
    Guest Service Excellence\n: Demonstrated commitment to world‑class guest service,\
    \ with the ability to build rapport, anticipate needs, and create memorable experiences\
    \ for a diverse international guest base.\nPeople Management & Coaching\n: Experience\
    \ supervising, coaching, and motivating multicultural teams, with the ability\
    \ to give clear direction, feedback, and recognition.\nCommunication Skills\n\
    : Fluent English language skills, both verbal and written, with the ability to\
    \ communicate clearly and confidently with guests and teammates at all levels.\n\
    Systems & Technology Proficiency\n: Comfortable using MS Office, F&B management\
    \ systems, and POS platforms; willing and able to learn and champion MedallionClass\
    \ applications and other onboard technologies.\nPublic Health, Safety & Compliance\n\
    : Solid understanding of public health, sanitation, and safety principles (e.g.\
    \ USPH or similar), with a strong focus on compliance and safe working practices.\n\
    Education & Professional Background\n: Preferably a graduate of a recognized hotel,\
    \ catering, or hospitality school, or equivalent professional experience in Food\
    \ & Beverage operations.\nPersonal Attributes\n: Personable, resilient, and culturally\
    \ aware, with outstanding interpersonal skills, a warm and caring approach, and\
    \ a genuine passion for surprising and delighting guests.\nTeamwork & Professionalism\n\
    : Proven ability to build and maintain courteous, professional working relationships\
    \ in a fast‑paced, multicultural, shipboard environment.\n\nJob Benefits\nEmbark\
    \ on a career adventure like no other! As part of the Princess Cruises team, you’ll\
    \ enjoy:\nA competitive salary package.\nYour comfortable double cabin - your\
    \ space to relax and recharge.\nCompany-paid travel to and from the ship, so you\
    \ can focus on the journey ahead.\nAccess to exclusive areas and benefits onboard\
    \ (depending on the rank and occupational group).\nA vibrant recreation and welfare\
    \ program designed to support your well-being and work-life balance.\nAccess to\
    \ exceptional learning and development opportunities to grow your skills and advance\
    \ your career.\nThe chance to travel the world, exploring exciting destinations\
    \ while doing what you love.\nA welcoming, inclusive, and dynamic work environment\
    \ where your contributions are valued.\nJoin us and become part of a global team\
    \ that’s passionate about delivering unforgettable experiences—both for our guests\
    \ and for one another.\n\uFEFF\n\uFEFF"
