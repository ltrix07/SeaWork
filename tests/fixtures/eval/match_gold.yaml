- profile_id: deckhand_to_officer
  profile_hash: 8ae39d42dc538bec
  opportunity_id: 242
  stratum: random
  employer: Princess Cruises
  description: "By applying to this position, your application will be submitted to\n\
    CSSI\n, one of Princess Cruises official Hiring Partners based in India. A recruiter\
    \ from CSSI will contact you soon if your qualifications align with our requirements\
    \ for this position.\nAs the world's leading cruise line, we understand that our\
    \ guests have high expectations of us, and we have high expectations of our team\
    \ members.\nWe appreciate your patience as we carefully review each candidate.\n\
    Set a course for adventure with Princess Cruises! The employer of choice in the\
    \ cruise industry, our fleet of Love Boats offer exceptional facilities and extensive\
    \ professional development and recreational programs for our valued teammates\
    \ who hail from more than 60 countries around the globe.\nAn iconic brand beloved\
    \ by millions, we love people who love what they do and work together to help\
    \ our guests create a lifetime of wonderful memories while providing friendly,\
    \ attentive and authentic service like only Princess can.\nAs a member of the\
    \ Princess Family, you’ll enjoy a truly adventurous career with excellent incentives,\
    \ unlimited opportunities for growth, and ports of call that will leave you breathless.\n\
    \nKey Responsibilities\nResponsible for all onboard culinary operations. Oversees\
    \ Galley management during operations to ensure menus are always executed in a\
    \ manner that is consistent with Company standards.\nEnsures product quality in\
    \ all food outlets by regularly monitoring tasting panels and inspecting mise-en-place\
    \ during preparation periods.\nAlways ensures that all passenger complaints regarding\
    \ menu delivery are resolved to the passenger's satisfaction. Takes full ownership\
    \ of any negative service interactions and ensures a timely, effective, and personalized\
    \ service recovery takes place, documenting and escalating accordingly.\nRegularly\
    \ ensures professional and visible appearances in all food outlets and public\
    \ areas during each voyage.\nAlways ensures menu options are available for guests\
    \ with special dietary requirements and requests and advises guests when possible.\n\
    Consistently exceeds the Food & Beverage Division specific targets and other key\
    \ result areas reducing friction points and avoiding negative surprises.\nUtilizing\
    \ Princess sponsored tools & systems ensures that each Culinary teammates always\
    \ execute their duties and responsibilities in regards to delivery, production,\
    \ and quality of food products.\nActively contributes to preparing and finalizing\
    \ accurate plans and quantities for local and container provisioning; does so\
    \ in a meaningful time frame to prevent shortages while adhering to food waste\
    \ control initiatives at all stages of production.\nAlways anticipates and plans\
    \ for Galley management rotational requests and communicates them to the shoreside\
    \ operational group via the Food and Beverage Director and Teammates Office in\
    \ a timely fashion.\nEffectively directs the Provision Master and Food and Beverage\
    \ Storekeepers in the efficient and economic ordering, preservation, and utilization\
    \ of provisions.\nCollaborates with the Hotel Inventory Manager, Food and Beverage\
    \ team and Galley department to ensure the culinary product is always produced,\
    \ journaled, and delivered within budgeted targets.\nAlways ensures that costs,\
    \ expenditures, and inventory of all Galley operational areas fall within the\
    \ established budgets/targets.\nRegularly inspects provisions to evaluate quality,\
    \ quantity, and conducts yield testing of key protein and production items.\n\
    Mentors the Culinary team through coaching, training, and ongoing development\
    \ to support career progression and conducts timely and fact-based performance\
    \ appraisals in line with each teammate's role description.\nEffectively communicates\
    \ company updates and strategies to the Culinary team using appropriate technology\
    \ to disseminate information as directed and host daily team meetings.\nEffectively\
    \ oversees the Dish department and ensures the Galley Supervisor and his/her staff\
    \ adhere to cleaning and sanitation standards.\nVerifies that all equipment is\
    \ maintained in a manner compliant with Company policies.\nMaintains current,\
    \ accurate knowledge of public health standards and ensures continuous compliance\
    \ with all hotel related public health policies.\n\nSkills, Knowledge & Expertise\n\
    Degree in Culinary Arts from a recognized culinary institution or three-year apprenticeship\
    \ in lieu thereof.\nMinimum of ten years of experience in large volume hotel or\
    \ culinary operations preferably with cruise ship experience of which at least\
    \ three years of experience were as Executive Chef or similar roles\nExtensive\
    \ knowledge of international cuisines and demonstrable cooking techniques.\nAbility\
    \ to lead and train subordinates and provide clear direction under pressure.\n\
    Fluent English language skills, both verbal and written.\nStrong background in\
    \ Food & Beverage Operations Management, including Product Delivery, Cost Control,\
