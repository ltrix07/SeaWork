[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seawork"
version = "0.1.0"
description = "SeaWork ingestion pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "langdetect>=1.0.9,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pyright>=1.1.390",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.8",
]

[project.scripts]
seawork = "seawork.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/seawork"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["seawork"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# This script emits Russian instructions into the hand-labelling template, so
# Cyrillic in string literals is the point, not an ambiguous-character mistake.
# Code comments elsewhere stay English — see the convention in src/.
"scripts/build_eval_sample.py" = ["RUF001"]
# Same reason, plus this one folds typographic quotes on purpose: the characters
# it matches on are exactly the "ambiguous" ones the rule warns about.
"scripts/check_eval_gold.py" = ["RUF001"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
