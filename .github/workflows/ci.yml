name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: seawork
          POSTGRES_USER: seawork
          POSTGRES_PASSWORD: seawork
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seawork"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pyright
      - run: coverage run -m pytest
      - run: coverage report
      - run: seawork db upgrade
      - run: docker build .

